<svg class="mapa" viewBox="0 0 100 60" role="img" aria-label="Mapa esquemático de Sorocaba">
  <!-- Fundo e ruas desenhadas de forma simplificada -->
  <rect class="fundo" width="100" height="60" rx="4" />
  <path class="rua" d="M0 20 H100 M0 42 H100 M30 0 V60 M70 0 V60" />
  <path class="rua principal" d="M0 55 L100 5" />

  <!-- Um marcador para cada local -->
  @for (local of locais; track local.id) {
    <g class="marcador" tabindex="0"
        [class.selecionado]="local.id === selecionadoId"
        (click)="selecionar.emit(local)"
        (keydown.enter)="selecionar.emit(local)">
      <circle [attr.cx]="local.x" [attr.cy]="local.y" r="2.4"
            [class]="'ponto ' + nivel(local.score)" />
      <title>{{ local.nome }} (score {{ local.score }})</title>
  </g>
    }
</svg>
